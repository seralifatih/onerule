name: offline_pass_manager
description: "Offline password manager application"
publish_to: 'none'
version: 2.0.1+11
environment:
  sdk: '>=3.2.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  # --- Legacy migration support (old Hive vault -> SQLCipher) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # --- Database ---
  sqflite_sqlcipher: ^3.4.0
  sqflite_common_ffi: ^2.3.6
  # --- Security ---
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  # --- State Management ---
  provider: ^6.1.2
  # --- Utilities ---
  uuid: ^4.2.2
  google_fonts: ^6.1.0
  # File & Backup
  path_provider: ^2.1.1
  file_picker: ^8.0.0
  share_plus: ^10.0.0
  # --- UI & Localization ---
  cupertino_icons: ^1.0.6
  flutter_localizations:
    sdk: flutter
  screen_protector: ^1.4.13
  cryptography: ^2.9.0
  shared_preferences: ^2.3.0
  intl: ">=0.19.0 <0.21.0"
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  flutter_svg: ^2.0.10+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
