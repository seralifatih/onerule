Categories:
  - Security
License: GPL-3.0-only
AuthorName: Fatih İlhan
WebSite: https://github.com/seralifatih/OneRule
SourceCode: https://github.com/seralifatih/OneRule
IssueTracker: https://github.com/seralifatih/OneRule/issues
Changelog: https://github.com/seralifatih/OneRule/releases

AutoName: OneRule

RepoType: git
Repo: https://github.com/seralifatih/OneRule.git

Builds:
  - versionName: 2.0.0
    versionCode: 10
    commit: 2.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.38.7
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - echo "flutter.sdk=$$flutter$$" > android/local.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.0.0
CurrentVersionCode: 10
