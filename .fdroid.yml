Categories:
  - Security
License: GPL-3.0-only
AuthorName: Fatih İlhan
WebSite: https://github.com/seralifatih/onerule
SourceCode: https://github.com/seralifatih/onerule
IssueTracker: https://github.com/seralifatih/onerule/issues
Changelog: https://github.com/seralifatih/onerule/releases

AutoName: OneRule

RepoType: git
Repo: https://github.com/seralifatih/onerule.git

Builds:
  - versionName: 2.0.3
    versionCode: 14
    commit: 2.0.3
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.41.4
    rm:
      - ios
      - linux
      - macos
      - windows
    prebuild: echo "flutter.sdk=$$flutter$$" > android/local.properties && $$flutter$$/bin/flutter
      config --no-analytics && $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build: $$flutter$$/bin/flutter build apk --release --no-pub

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.0.3
CurrentVersionCode: 14
