name: DocDrifter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  id-token: write

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seralifatih/docdrifter@v1
        with:
          src-path: "lib/"
          docs-path: "docs/"
          repo-description: "OneRule, an offline-first Android/Flutter password manager using AES-256 and SQLCipher"
